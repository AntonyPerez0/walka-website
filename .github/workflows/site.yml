name: Site

# Builds the site and checks it on every push and pull request. From the
# default branch it is then published to GitHub Pages.
#
# * Every action is named by the commit it is at, not by a tag: a tag can be
#   moved to other code by whoever holds the action's repository. (The
#   version that commit is stands next to it; .github/dependabot.yml
#   proposes newer ones.) Walka's own build does the same.
# * npm installs exactly what package-lock.json names, checksums included
#   (`npm ci`), and nothing else.
# * The site is built without knowing its address: every link in it is
#   relative, so the same files work at https://<user>.github.io/<repo>/
#   and on a domain of its own. The one thing the build is told is the full
#   public address, for the few places that must name it (the sitemap, the
#   canonical link, link previews). GitHub Pages is asked for it here, so a
#   custom domain is picked up by the next run with nothing to edit.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci

      - name: Ask GitHub Pages for the site's address
        id: pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if info=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null); then
            url=$(jq -r '.html_url // ""' <<<"$info")
            source=$(jq -r '.build_type // ""' <<<"$info")
            echo "site_url=${url%/}" >> "$GITHUB_OUTPUT"
            if [ "$source" = "workflow" ]; then
              echo "publish=yes" >> "$GITHUB_OUTPUT"
              echo "Publishing to ${url}"
            else
              echo "::warning::GitHub Pages is on, but its source is not 'GitHub Actions'. Nothing is published. Change it under Settings > Pages > Build and deployment > Source."
            fi
          else
            echo "::notice::GitHub Pages is not switched on for this repository yet, so the site is built and checked but not published. Switch it on under Settings > Pages > Build and deployment > Source: GitHub Actions, then run this workflow again."
          fi

      - name: Check the code
        run: npm run check
      # Accounts: where they are kept. These are repository VARIABLES, not
      # secrets (Settings > Secrets and variables > Actions > Variables):
      # the key is the project's public key and ends up in the pages. Left
      # unset, the site is built without accounts.
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          SIGN_IN: ${{ vars.SIGN_IN }}
          CONTACT: ${{ vars.CONTACT }}
          ACCOUNTS_REGION: ${{ vars.ACCOUNTS_REGION }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
        run: npm run build
      - name: Check the built site
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SIGN_IN: ${{ vars.SIGN_IN }}
          CONTACT: ${{ vars.CONTACT }}
          ACCOUNTS_REGION: ${{ vars.ACCOUNTS_REGION }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
        run: npm run verify

      - name: Hand the site to GitHub Pages
        if: steps.pages.outputs.publish == 'yes'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/
          # .nojekyll and anything under .well-known belong to the site too.
          include-hidden-files: true

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One publication at a time, and one that has started is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
